[target.wasm32-unknown-emscripten]
rustflags = [
	"-C",
	"link-arg=-sMODULARIZE=1",
	"-C",
	"link-arg=-sEXPORT_NAME=createFibModule",
	"-C",
	"link-arg=-sEXPORTED_FUNCTIONS=['_fib']",
	"-C",
	"link-arg=-sEXPORT_ES6=1",
	"-C",
	"link-arg=-sENVIRONMENT=web,worker",
	"-C",
	"link-arg=-sFILESYSTEM=0"
]
